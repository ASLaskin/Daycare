name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  no-ai-coauthors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: reject ai coauthored commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          offenders=$(git log -i -E --grep='^co-authored-by:.*(claude|anthropic|codex|openai|chatgpt|copilot)' --format='  %h %s' "$range")
          if [ -n "$offenders" ]; then
            echo "::error::twin i know you use ai but atleast push the commits yourself. dont coauthor"
            echo "$offenders"
            exit 1
          fi
