name: Daycare
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  DaycareKit:
    path: DaycareKit
targets:
  Daycare:
    type: application
    platform: iOS
    sources:
      - path: Daycare
    dependencies:
      - package: DaycareKit
      - target: DaycareWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).daycare
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Daycare
    info:
      path: Daycare/Info.plist
      properties:
        CFBundleDisplayName: Daycare
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DaycareAppGroup: group.$(BUNDLE_ID_PREFIX).daycare
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Scan the pairing code on your Mac and take photos to send to sessions.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX).daycare.pair
            CFBundleURLSchemes:
              - daycare
    entitlements:
      path: Daycare/Daycare.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).daycare
  DaycareWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DaycareWidgets
    dependencies:
      - package: DaycareKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).daycare.widgets
        SKIP_INSTALL: YES
    info:
      path: DaycareWidgets/Info.plist
      properties:
        CFBundleDisplayName: Daycare Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DaycareAppGroup: group.$(BUNDLE_ID_PREFIX).daycare
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DaycareWidgets/DaycareWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).daycare
schemes:
  Daycare:
    build:
      targets:
        Daycare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: DaycareKit/WireTests
        - package: DaycareKit/SyncTests
